version: 1

settings:
  log_path: "C:/claude/security-gate/log/security.jsonl"

rules:

  # =========================================================
  # カテゴリ1: ファイルシステム破壊
  # =========================================================

  - id: fs_destroy_rm_rf
    description: "rm -rf による再帰削除"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        # -rf / -fr / -r -f / -f -r などの組み合わせを全てカバー
        # (?=...)ルックアヘッドで r と f の両方を含むフラグ文字列を検出
        pattern: "rm\\s+(-(?=[a-zA-Z]*r)(?=[a-zA-Z]*f)[a-zA-Z]+|(-[rR]\\s+-[fF])|(-[fF]\\s+-[rR])|--no-preserve-root)"

  - id: fs_destroy_rmdir_windows
    description: "rmdir /s による Windows 再帰削除"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)rmdir\\s+(/s|/q)"

  - id: fs_destroy_remove_item_recurse
    description: "Remove-Item -Recurse による PowerShell 再帰削除"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)Remove-Item\\s+.*-Recurse"

  - id: fs_destroy_format
    description: "format コマンドによるディスクフォーマット"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)^\\s*format\\s+[a-zA-Z]:"

  - id: fs_destroy_dd_wipe
    description: "dd によるディスク上書き"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "dd\\s+.*of=(/dev/|/dev/sd|/dev/nvme)"

  # =========================================================
  # カテゴリ2: リモートコード実行（RCE）
  # =========================================================

  - id: rce_curl_pipe_bash
    description: "curl/wget をシェルにパイプして実行"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        # python/ruby へのパイプ実行も追加
        pattern: "(?i)(curl|wget)[^|\\n]*\\|\\s*((ba)?sh|python[23]?|ruby|perl)"

  - id: rce_process_substitution
    description: "プロセス置換によるリモートスクリプト実行"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)(ba)?sh\\s*<\\s*<\\((curl|wget)"

  - id: rce_base64_exec
    description: "base64 デコードしてシェルに渡す実行パターン"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)(echo|printf)[^|\\n]*\\|\\s*base64\\s*-d[^|\\n]*\\|\\s*(ba)?sh"

  - id: rce_eval_external
    description: "eval + 外部コマンド展開によるコード実行"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "eval\\s+\\$\\((curl|wget|cat)"

  # =========================================================
  # カテゴリ3: 権限昇格
  # =========================================================

  - id: privesc_sudo_shell
    description: "sudo を使ったインタラクティブシェル取得"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        # sudo -i でインタラクティブ root シェルを取得するパターンも追加
        pattern: "(?i)(sudo\\s+(su|bash|sh|zsh|fish|dash)(\\s|$)|sudo\\s+-i\\b)"

  - id: privesc_sudoers_edit
    description: "sudoers ファイルの直接編集"
    action: block
    tools: [Bash, Write, Edit]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)(visudo|/etc/sudoers)"
      - type: path_match
        field: file_path
        paths: ["/etc/sudoers", "/etc/sudoers.d/**"]

  - id: privesc_ld_preload
    description: "LD_PRELOAD による共有ライブラリ差し替え"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "LD_PRELOAD="

  # =========================================================
  # カテゴリ4: AI 固有攻撃（プロンプトインジェクション対策）
  # =========================================================

  - id: ai_attack_claude_md
    description: "CLAUDE.md の改ざん（Write/Edit ツール経由）"
    action: log
    tools: [Write, Edit]
    conditions:
      - type: path_match
        field: file_path
        paths: ["**/CLAUDE.md", "**/claude.md"]

  - id: ai_attack_settings_json
    description: "Claude Code 設定ファイルの改ざん"
    action: block
    tools: [Write, Edit]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.claude/settings.json"
          - "**/.claude/settings.local.json"

  - id: ai_attack_hook_scripts
    description: "security-gate / mattermost-gate スクリプト自体の改ざん（Write/Edit）"
    action: log
    tools: [Write, Edit]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/security-gate/hook.py"
          - "**/security-gate/rule_engine.py"
          - "**/security-gate/rules.yaml"
          - "**/mattermost-gate/permissionrequest.py"
          - "**/mattermost-gate/lib/**"

  - id: ai_attack_hook_bash_overwrite
    description: "Bash リダイレクトによるフック/設定ファイル上書き"
    action: log
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)(security-gate|mattermost-gate).*(hook\\.py|rule_engine\\.py|rules\\.yaml|permissionrequest\\.py)"
      - type: regex
        field: command
        # .cursorrules（TrapDoor 攻撃ベクタ）も追加
        pattern: "(?i)(>|>>|Out-File).*(\\.claude[/\\\\]settings|\\.claude[/\\\\]settings\\.local|CLAUDE\\.md|\\.cursorrules)"

  - id: ai_attack_memory_write
    description: "Claude Code メモリファイルの改ざん"
    action: log
    tools: [Write, Edit]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.claude/projects/**/memory/**"
          - "**/.claude/projects/**/MEMORY.md"

  # =========================================================
  # カテゴリ5: Git 破壊操作
  # =========================================================

  - id: git_force_push
    description: "git push --force（--force-with-lease は除外）"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        # --force-with-lease は安全なので除外
        pattern: "(?i)git\\s+push\\s+(?!.*--force-with-lease).*(-f\\b|--force\\b)"

  - id: git_reset_hard
    description: "git reset --hard によるコミット履歴巻き戻し"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)git\\s+reset\\s+--hard"

  - id: git_clean_force
    description: "git clean -f による未追跡ファイル削除（ログのみ）"
    action: log
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)git\\s+clean\\s+.*-[a-zA-Z]*f"

  # =========================================================
  # カテゴリ6: 機密ファイルの読み取り
  # =========================================================

  - id: secret_read_ssh_key
    description: "SSH 秘密鍵の読み取り"
    action: block
    tools: [Read, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/id_rsa"
          - "**/id_ed25519"
          - "**/id_ecdsa"
          - "**/.ssh/id_*"
          - "**/*.pem"
          - "**/*.p12"
          - "**/*.pfx"
      - type: regex
        field: command
        pattern: "cat\\s+.*(id_rsa|id_ed25519|id_ecdsa|\\.pem|\\.p12|\\.pfx)"

  - id: secret_read_credentials
    description: "クラウド・サービス認証情報ファイルの読み取り"
    action: block
    tools: [Read, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.aws/credentials"
          - "**/.netrc"
          - "**/credentials.json"
          - "**/*_key.json"
          - "**/.gcloud/credentials.json"
      - type: regex
        field: command
        pattern: "cat\\s+.*(credentials|\\.netrc|_key\\.json)"

  - id: secret_read_env
    description: ".env ファイルの読み取り（ログのみ）"
    action: log
    tools: [Read, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.env"
          - "**/.env.*"
      - type: regex
        field: command
        pattern: "cat\\s+.*\\.env"

  - id: secret_send_credentials
    description: "認証情報を外部 URL に curl で送信"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)curl\\s+.*-d\\s+@.*(credentials|\\.env|id_rsa|id_ed25519)"
      - type: regex
        field: command
        pattern: "(?i)env\\s*\\|\\s*curl"

  # =========================================================
  # カテゴリ7: システム停止・プロセス妨害
  # =========================================================

  - id: system_shutdown
    description: "shutdown / reboot / halt によるシステム停止"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)\\b(shutdown|reboot|halt|poweroff|init\\s+0|init\\s+6)(\\s|$)"

  - id: system_kill_init
    description: "PID 1（init）への kill -9"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "kill\\s+-9\\s+1\\b"

  - id: system_fork_bomb
    description: "フォーク爆弾パターン"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: ":\\(\\)\\s*\\{\\s*:|:\\s*\\|\\s*:&"

  # =========================================================
  # カテゴリ8: ネットワーク・リバースシェル
  # =========================================================

  - id: network_reverse_shell_nc
    description: "netcat を使ったリバースシェル"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)nc(at)?\\s+.*-e\\s+.*(ba)?sh"

  - id: network_reverse_shell_bash
    description: "bash の TCP リダイレクトによるリバースシェル"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "bash\\s+-i\\s+>&?\\s*/dev/tcp/"

  - id: network_firewall_flush
    description: "iptables/ufw によるファイアウォール無効化"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)(iptables\\s+-F|ufw\\s+disable|ufw\\s+reset)"

  # =========================================================
  # カテゴリ9: パーシステンス（永続化）
  # =========================================================

  - id: persist_crontab_write
    description: "crontab -e/-r によるクーロンジョブ操作"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)crontab\\s+(-e|-r)\\b"

  - id: persist_cron_file_write
    description: "/etc/cron* や /var/spool/cron への直接書き込み"
    action: block
    tools: [Write, Edit, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "/etc/crontab"
          - "/etc/cron.d/**"
          - "/etc/cron.daily/**"
          - "/etc/cron.hourly/**"
          - "/var/spool/cron/**"
      - type: regex
        field: command
        pattern: "(?i)(>|>>)\\s*/etc/cron|(?i)(>|>>)\\s*/var/spool/cron"

  - id: persist_systemd_service_write
    description: "systemd サービスファイルの作成・変更（バックドア設置）"
    action: block
    tools: [Write, Edit, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "/etc/systemd/system/**"
          - "/usr/lib/systemd/system/**"
          - "**/systemd/user/**"
      - type: regex
        field: command
        pattern: "(?i)(>|>>)\\s*/etc/systemd/system/"

  - id: persist_systemd_enable
    description: "systemctl enable によるサービス自動起動設定（ログのみ）"
    action: log
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)systemctl\\s+enable\\b"

  - id: persist_windows_registry_run
    description: "Windows レジストリ Run キーへの永続化エントリ追加"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)reg\\s+add\\s+HK[LC][MU]\\\\.*\\\\(Run|RunOnce)"

  - id: persist_profile_system_write
    description: "/etc/profile.d/** へのシステム全体プロファイル書き込み"
    action: block
    tools: [Write, Edit, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "/etc/profile.d/**"
          - "/etc/profile"
          - "/etc/environment"
      - type: regex
        field: command
        pattern: "(?i)(>|>>)\\s*/etc/profile"

  # =========================================================
  # カテゴリ10: サプライチェーン攻撃
  # =========================================================

  - id: supply_chain_pip_trusted_host
    description: "pip install --trusted-host による SSL 証明書検証スキップ"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)(pip|pip3|uv\\s+pip)\\s+(install|download)\\s+.*--trusted-host"

  - id: supply_chain_pip_custom_index
    description: "pip install で非公式インデックスを指定（サプライチェーン攻撃リスク）"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        # pypi.org / files.pythonhosted.org 以外のインデックスを指定する場合のみブロック
        pattern: "(?i)(pip|pip3|uv\\s+pip)\\s+(install|download)\\s+.*(--index-url|-i)\\s+https?://(?!(files\\.pythonhosted\\.org|pypi\\.org))"

  - id: supply_chain_npm_registry
    description: "npm install で非公式レジストリを指定（サプライチェーン攻撃リスク）"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)npm\\s+(install|i)\\s+.*--registry\\s+https?://(?!registry\\.npmjs\\.org)"

  # =========================================================
  # カテゴリ11: データ外部送信（新パターン）
  # =========================================================

  - id: exfil_tar_pipe_curl
    description: "tar アーカイブを curl で外部送信"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "tar\\s+[a-zA-Z-]*[czjJt]+[a-zA-Z-]*\\s+.*\\|.*curl"

  - id: exfil_history_curl
    description: "シェル履歴を curl で外部送信"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "history\\s*\\|.*curl"

  - id: exfil_find_exec_curl
    description: "find コマンドで収集したファイルを curl で外部送信"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "find\\s+.*(-exec|-execdir)\\s+curl|find\\s+.*\\|\\s*xargs\\s+.*curl"

  # =========================================================
  # カテゴリ12: コンテナ脱出（強化）
  # =========================================================

  - id: container_privileged_run
    description: "docker run --privileged によるコンテナ特権昇格"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "docker\\s+run\\s+.*--privileged"

  - id: container_sensitive_mount
    description: "docker run でルートパスをマウント（ホスト脱出リスク）"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        # -v / や --volume / で絶対パスマウントを検出
        pattern: "docker\\s+run\\s+.*(-v|--volume)\\s+/"

  - id: container_pid_host
    description: "docker run --pid=host によるホストプロセス空間共有"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "docker\\s+run\\s+.*--pid=host"

  - id: container_nsenter
    description: "nsenter でホスト PID 1 の名前空間に侵入"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "nsenter\\s+.*--target\\s+1\\b"

  # =========================================================
  # カテゴリ13: 難読化・バイパスパターン
  # =========================================================

  - id: bypass_eval_variable
    description: "eval + シェル変数によるコマンド実行（難読化バイパス）"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "eval\\s+\\$[\\{\\(]?\\w"

  - id: bypass_heredoc_bash
    description: "ヒアドキュメントによる bash へのコマンド渡し（ログのみ）"
    action: log
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(ba)?sh\\s+<<"

  - id: bypass_python_c_exec
    description: "python -c でシステムコマンドやサブプロセスを実行"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "python[23]?\\s+-c\\s+['\"].*(__import__|os\\.system|subprocess|exec\\s*\\()"

  - id: bypass_node_e_exec
    description: "node -e で child_process を使ってシステムコマンドを実行"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "node\\s+-e\\s+.*child_process"

  # =========================================================
  # カテゴリ14: 暗号マイナー・ネットワーク偵察
  # =========================================================

  - id: miner_execution
    description: "暗号通貨マイニングツールの実行"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)\\b(xmrig|minerd|cpuminer|cryptonight|ethminer|cgminer|bfgminer)\\b"

  - id: network_scan
    description: "ネットワークスキャンツールの実行（ログのみ）"
    action: log
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)\\b(nmap|masscan)\\s+"

  # =========================================================
  # カテゴリ15: AI 固有攻撃（強化）
  # =========================================================

  - id: ai_zero_width_inject
    description: "ゼロ幅 Unicode 文字を含むファイル書き込み（TrapDoor 型 AI 攻撃）"
    action: block
    tools: [Write, Edit]
    conditions:
      # U+200B ZERO WIDTH SPACE / U+200C ZERO WIDTH NON-JOINER /
      # U+200D ZERO WIDTH JOINER / U+2060 WORD JOINER / U+FEFF BOM
      - type: regex
        field: content
        pattern: "[​‌‍⁠﻿]"
      - type: regex
        field: new_string
        pattern: "[​‌‍⁠﻿]"

  - id: ai_mcp_config_write
    description: "MCP サーバー設定ファイルの改ざん（Tool Poisoning 対策）"
    action: block
    tools: [Write, Edit]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.mcp.json"
          - "**/mcp_servers.json"
          - "**/mcp-config.json"
          - "**/.mcp/**"

  - id: ai_cursorrules_write
    description: ".cursorrules への書き込み（TrapDoor 攻撃：AI への隠し指示を埋め込む）"
    action: block
    tools: [Write, Edit]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.cursorrules"
          - "**/.cursor/rules/**"
