rules:

  - id: supply_chain_pip_trusted_host
    description: "pip install --trusted-host による SSL 証明書検証スキップ"
    action: block
    tools: [Bash]
    conditions:
      - type: contains_all
        field: command
        values: ["pip", "--trusted-host"]

  - id: supply_chain_pip_custom_index
    description: "pip install で非公式インデックスを指定（サプライチェーン攻撃リスク）"
    action: block
    tools: [Bash]
    conditions:
      - type: contains_all
        field: command
        values: ["pip", "--index-url"]
        unless_any: ["pypi.org", "files.pythonhosted.org"]

  - id: supply_chain_npm_registry
    description: "npm install で非公式レジストリを指定（サプライチェーン攻撃リスク）"
    action: block
    tools: [Bash]
    conditions:
      - type: contains_all
        field: command
        values: ["npm", "--registry"]
        unless: "registry.npmjs.org"
