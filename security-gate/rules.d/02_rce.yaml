rules:

  - id: rce_curl_pipe_bash
    description: "curl/wget をシェルにパイプして実行"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: match
        field: command
        all: ["curl", "|"]
        any: ["sh", "python", "ruby", "perl"]
      - type: match
        field: command
        all: ["wget", "|"]
        any: ["sh", "python", "ruby", "perl"]

  - id: rce_process_substitution
    description: "プロセス置換によるリモートスクリプト実行"
    action: block
    tools: [Bash]
    conditions:
      - type: contains_all
        field: command
        values: ["sh", "(curl"]
      - type: contains_all
        field: command
        values: ["sh", "(wget"]

  - id: rce_base64_exec
    description: "base64 デコードしてシェルに渡す実行パターン"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: contains_all
        field: command
        values: ["base64", "-d", "|", "sh"]

  - id: rce_eval_external
    description: "eval + 外部コマンド展開によるコード実行"
    action: block
    tools: [Bash]
    conditions:
      - type: contains_any
        field: command
        values: ["eval $(curl", "eval $(wget", "eval $(cat"]
