rules:

  - id: secret_read_ssh_key
    description: "SSH 秘密鍵の読み取り"
    action: block
    tools: [Read, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/id_rsa"
          - "**/id_ed25519"
          - "**/id_ecdsa"
          - "**/.ssh/id_*"
          - "**/*.pem"
          - "**/*.p12"
          - "**/*.pfx"
      - type: regex
        field: command
        pattern: "cat\\s+.*(id_rsa|id_ed25519|id_ecdsa|\\.pem|\\.p12|\\.pfx)"

  - id: secret_read_credentials
    description: "クラウド・サービス認証情報ファイルの読み取り"
    action: block
    tools: [Read, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.aws/credentials"
          - "**/.netrc"
          - "**/credentials.json"
          - "**/*_key.json"
          - "**/.gcloud/credentials.json"
      - type: regex
        field: command
        pattern: "cat\\s+.*(credentials|\\.netrc|_key\\.json)"

  - id: secret_read_env
    description: ".env ファイルの読み取り（ログのみ）"
    action: block
    tools: [Read, Bash]
    conditions:
      - type: path_match
        field: file_path
        paths:
          - "**/.env"
          - "**/.env.*"
      - type: contains_all
        field: command
        values: ["cat", ".env"]

  - id: secret_send_credentials
    description: "認証情報を外部 URL に curl で送信"
    action: block
    tools: [Bash]
    conditions:
      - type: regex
        field: command
        pattern: "(?i)curl\\s+.*-d\\s+@.*(credentials|\\.env|id_rsa|id_ed25519)"
      - type: contains_all
        field: command
        values: ["env", "|", "curl"]
