rules:

  - id: git_force_push
    description: "git push --force（--force-with-lease は除外）"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: contains_all
        field: command
        values: ["git push", "--force"]
        unless: "--force-with-lease"
      - type: contains_all
        field: command
        values: ["git push", " -f"]
        unless: "--force-with-lease"

  - id: git_reset_hard
    description: "git reset --hard によるコミット履歴巻き戻し"
    action: block
    tools: [Bash, PowerShell]
    conditions:
      - type: contains_all
        field: command
        values: ["git reset", "--hard"]

  - id: git_clean_force
    description: "git clean -f による未追跡ファイル削除（ログのみ）"
    action: log
    tools: [Bash, PowerShell]
    conditions:
      - type: contains_all
        field: command
        values: ["git clean", "-f"]
