id: login
title: ログイン
url: /user/login
jsp: user/login.jsp
assertions:
  on_load:
  - type: title
    value: ログイン
  - type: h1
    value: ログイン
  - type: url
    value: /user/login
forms:
- id: loginForm
  action: /user/login
  method: post
  inputs:
  - name: username
    id: username
    label: ユーザー名
    type: text
    required: true
  - name: password
    id: password
    label: パスワード
    type: password
    required: true
  buttons:
  - id: loginBtn
    label: ログイン
    type: submit
  transition_to: login
  bound_class: null
standalone_inputs: []
nav_links:
- text: 新規登録はこちら
  href: /user/register
  transition_to: user_register
js_actions: []
