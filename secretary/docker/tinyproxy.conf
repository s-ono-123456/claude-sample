# secretary egress-proxy 設定
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 20

# 接続元制限はネットワーク側で担保する（secretary_internal は internal ネットワーク）
Allow 0.0.0.0/0

# HTTPS CONNECT は 443 のみ許可
ConnectPort 443

# ドメイン許可リスト（deny-by-default）
# 一覧は egress-allowlist.txt で管理する（1行1件・ERE 正規表現）
FilterType ere
Filter "/etc/tinyproxy/egress-allowlist.txt"
FilterDefaultDeny Yes

LogLevel Notice
