[project]
name = "claude"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "javalang==0.13.0",
    "lxml>=4.9",
    "neo4j>=5.0",
    "pyyaml>=6.0",
    "requests>=2.33.1",
    "sqlparse>=0.4",
    "streamlit>=1.35",
    "pyvis>=0.3",
    "rich>=13.0",
    "python-pptx>=1.0.2",
    "pymupdf>=1.27.2.3",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
